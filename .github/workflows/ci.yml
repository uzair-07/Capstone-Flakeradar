name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flakeradar" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      FLAKERADAR_DATABASE_URL: postgresql+psycopg://flakeradar:flakeradar@localhost:5432/flakeradar_test
      FLAKERADAR_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (unit + integration)
        run: pytest -q -rs

  uploader:
    name: uploader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run lint
      - run: npm run build

  stack:
    name: stack smoke test
    needs: [backend, uploader, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the full stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Create a project and token
        run: |
          token=$(docker compose exec -T api python -m app.cli create-project --name "Smoke" --slug smoke --json | jq -r .token)
          echo "::add-mask::$token"
          echo "FLAKERADAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Upload sample reports through the web proxy
        run: |
          pip install ./uploader
          flakeradar-upload "backend/tests/fixtures/junit/pytest.xml" "backend/tests/fixtures/junit/jest.xml" \
            --server http://localhost:8080 --project smoke --wait --fail-on-error
      - name: Check the runs API and the web page
        run: |
          runs=$(curl -fsS http://localhost:8080/api/v1/projects/smoke/runs | jq '.items | length')
          test "$runs" -eq 2
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
