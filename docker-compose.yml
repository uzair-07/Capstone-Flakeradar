# Full local stack: http://localhost:8080 (web + API), API docs at /api/docs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flakeradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flakeradar}  # local development default
      POSTGRES_DB: flakeradar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakeradar -d flakeradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment: &backend-env
      FLAKERADAR_DATABASE_URL: postgresql+psycopg://flakeradar:${POSTGRES_PASSWORD:-flakeradar}@db:5432/flakeradar
      FLAKERADAR_REDIS_URL: redis://redis:6379/0
      FLAKERADAR_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # migrations have run

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
